name: Build the Luma installer
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag containing a verified Luma ZIP
        required: true
        type: string
      archive:
        description: Exact ZIP asset filename
        required: true
        type: string
      sha256:
        description: Expected SHA256 of the ZIP
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: installer-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  installer:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_ARCHIVE: ${{ inputs.archive }}
      EXPECTED_SHA256: ${{ inputs.sha256 }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate release inputs
        run: |
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'v[0-9]+\.[0-9]+(?:\.[0-9]+)?',os.environ['RELEASE_TAG'])
          assert re.fullmatch(r'Luma-[0-9.]+\.zip',os.environ['RELEASE_ARCHIVE'])
          assert re.fullmatch(r'[0-9a-f]{64}',os.environ['EXPECTED_SHA256'])
          PY
      - name: Download and verify the application
        run: |
          mkdir -p incoming
          gh release download "$RELEASE_TAG" --pattern "$RELEASE_ARCHIVE" --dir incoming
          printf '%s  %s\n' "$EXPECTED_SHA256" "incoming/$RELEASE_ARCHIVE" | shasum -a 256 -c -
          ditto -x -k "incoming/$RELEASE_ARCHIVE" incoming
          codesign --verify --deep --strict incoming/Luma.app
      - name: Install pinned packaging tools
        run: python3 -m pip install dmgbuild==1.6.7 ds-store==1.3.3 mac-alias==2.2.3
      - name: Build and validate the designed installer
        run: python3 outputs/build-luma-dmg.py --app "$PWD/incoming/Luma.app" --output "$PWD/outputs/Luma.dmg"
      - name: Publish verified installer
        run: gh release upload "$RELEASE_TAG" outputs/Luma.dmg outputs/Luma.sha256 outputs/Luma.validation.json --clobber
